AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dispatcher Service (PROD)

Parameters:
  QueueArn:
    Type: String
  TelegramToken:
    Type: String
  ChatId:
    Type: String

Resources:

  DispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dispatcher-prod
      CodeUri: ./src
      Handler: lambda_function.lambda_handler
      Runtime: python3.14
      MemorySize: 128
      Timeout: 5

      Environment:
        Variables:
          TELEGRAM_TOKEN: !Ref TelegramToken
          CHAT_ID: !Ref ChatId

      Policies:
        - SQSPollerPolicy:
            QueueName: !Select [5, !Split [":", !Ref QueueArn]]

      Events:
        SQS:
          Type: SQS
          Properties:
            Queue: !Ref QueueArn
            BatchSize: 10