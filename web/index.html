<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketOps - IT Support Portal</title>
  
  <!-- Import Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      /* Background gradient yang lebih soft & modern */
      background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #334155;
    }

    /* Container Utama */
    .ticket-container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    /* Card Box */
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      overflow: hidden; /* Agar gambar header tidak keluar dari border-radius */
    }

    /* Header Image (Dari Unsplash) */
    .card-header {
      height: 160px;
      /* Gambar bertema server / network infrastructure */
      background-image: url('https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=1000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    /* Overlay gradasi gelap di atas gambar */
    .card-header::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.6));
    }

    /* Teks di atas Header Image */
    .header-title {
      position: absolute;
      bottom: 15px;
      left: 20px;
      color: #ffffff;
      z-index: 1;
    }

    .header-title h2 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-title p {
      font-size: 13px;
      opacity: 0.9;
    }

    /* Body Card */
    .card-body {
      padding: 30px 24px;
    }

    /* Form Label & Input */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #475569;
    }

    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      resize: vertical;
      min-height: 120px;
      transition: all 0.3s ease;
      background-color: #f8fafc;
    }

    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    /* Button Styling */
    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.1s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    /* Status Alert Banner */
    .alert {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      display: none; /* Sembunyikan default */
    }

    .alert.loading {
      display: block;
      background-color: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
    }

    .alert.success {
      display: block;
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .alert.error {
      display: block;
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* Footer / Credit */
    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div class="ticket-container">
    <div class="card">
      <!-- Image Header -->
      <div class="card-header">
        <div class="header-title">
          <h2>🚨 TicketOps</h2>
          <p>System & Network Incident Reporting</p>
        </div>
      </div>

      <!-- Form Body -->
      <div class="card-body">
        <form id="form">
          <div class="form-group">
            <label for="msg">Detail Kendala / Log Error</label>
            <textarea id="msg" placeholder="Contoh: Koneksi terputus, server tidak bisa diakses, atau indikator error pada sistem..." required></textarea>
          </div>
          
          <button type="submit" id="submitBtn">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path>
            </svg>
            <span id="btnText">Kirim Tiket</span>
          </button>
        </form>

        <!-- Status Message Div -->
        <div id="statusAlert" class="alert"></div>
      </div>
    </div>
    
    <div class="footer">
      Secured by AWS Cloud Infrastructure
    </div>
  </div>

  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();

      const msgInput = document.getElementById("msg");
      const statusAlert = document.getElementById("statusAlert");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");

      // Set Loading State
      submitBtn.disabled = true;
      btnText.innerText = "Mengirim...";
      statusAlert.className = "alert loading";
      statusAlert.innerText = "⏳ Sedang meneruskan tiket ke sistem...";

      try {
        const res = await fetch("API_URL_PLACEHOLDER/ticket", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: msgInput.value,
            source: "web"
          })
        });

        if (!res.ok) throw new Error("Network response was not ok");

        // Set Success State
        statusAlert.className = "alert success";
        statusAlert.innerText = "✅ Tiket berhasil dikirim ke teknisi!";
        msgInput.value = ""; // Clear input

      } catch (err) {
        // Set Error State
        statusAlert.className = "alert error";
        statusAlert.innerText = "❌ Gagal mengirim tiket. Periksa koneksi Anda.";
        console.error(err);
      } finally {
        // Reset Button State
        submitBtn.disabled = false;
        btnText.innerText = "Kirim Tiket";
        
        // Sembunyikan alert setelah 5 detik jika sukses
        if (statusAlert.classList.contains('success')) {
            setTimeout(() => {
                statusAlert.style.display = 'none';
                statusAlert.className = 'alert'; // reset class
            }, 5000);
        }
      }
    };
  </script>

</body>
</html>
